<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Price</title>
    <style>

        :root {
        --primary: #0f76e4e0;          
        --accent: #e65100c4;           
        --bg: #fff8f8c2;               
        --surface: #ffffffce;          
        --text-main: #252d35be;        
        --text-muted: #6c757d93;       
        --border: #ccccccb2;           
        --focus-ring: rgba(0, 123, 255, 0.445);
        }

        body{
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 25px;
            display: flex;
            justify-content: center;
        }

        #container{
            margin-bottom: 20px;
        }

        label {
            display: block; 
            margin: 25px 0 10px; 
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase; 
            letter-spacing: 0.05em;
        }

        .input-group {
            display: block; 
        }

        input[type="number"],
        input[type="button"],
        input[type="reset"] {
            display: block; 
            width: 100%; 
            box-sizing: border-box; 
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease; 
        }

        input[type="number"] {
            border: 1.5px solid var(--border);
            color: var(--text-main);
            background-color: #fff;
            outline: none; 
            margin-bottom: 12px; 
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--focus-ring); 
        }

        input[type="button"], 
        input[type="reset"] {
            background-color: var(--accent);
            color: #fff;
            border: none;
            font-weight: 600;
            cursor: pointer; 
            box-shadow: 0 2px 4px rgba(249, 115, 22, 0.2); 
        }

        #btnCompute {
            margin-bottom: 20px;
        }

        #btnReset {
            margin-bottom: 20px;
        }

        input[type="button"]:hover
        input[type="reset"]:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 4px 8px rgba(249, 115, 22, 0.3);
        }

        input[type="button"]:active
        input[type="reset"]:active {
            transform: translateY(1px);
        }

    </style>
</head>
<body>
    <form>
        <div id="container">
            <h3><b>Discount Calculation</b></h3>

            <label for="price">Price Before Discount</label>
            <input type="number" id="price" step="0.01" min="0">

            <label for="discount">Discount (%)</label>
            <input type="number" id="discount" step="0.01" min="0" max="100">

            <label for="price-after">Price after Discount</label>
            <output id="priceAfter">&#8369 0.00</output>

            <laber for="saved-amount">Saved amount</laber>
            <output id="savedAmount">&#8369 0.00</output>

            <br><br>
            <input type="button" id="btnCompute" value="Compute">
            <input type="reset" id="btnReset" value="Reset">

            <label> Programmed by: Grade-12 Section Cooper Dale Danielle A. Peralta</label>
        </div>
    </form>
    <script>

        function computeDiscount(){
        const thePrice = document.getElementById("price");
        const theDiscount = document.getElementById("discount");
        const priceAfter = document.getElementById("priceAfter");
        const savedAmount = document.getElementById("savedAmount");
        const theButton = document.getElementById("btnCompute");
        const btnReset = document.getElementById("btnReset");

            /* const convertedPrice = parseFloat(thePrice.value); */
           const priceVal = parseFloat(thePrice.value);
           const discountVal = parseFloat(theDiscount.value);
            /*alert("The price is " + priceVal);*/
            const saved = priceVal * (discountVal / 100);
            const finalPrice = priceVal - saved;
            priceAfter.innerText = "$" + finalPrice;
            savedAmount.innerText = "$" + saved;
        }

        function resetForm() {
            priceAfter.innerText = "$0.00";
            savedAmount.innerText = "$0.00";
        }

        const theButton = document.getElementById("btnCompute");

        theButton.addEventListener('click', computeDiscount);
        btnReset.addEventListener('click', resetForm);
    </script>
</body>
</html>
