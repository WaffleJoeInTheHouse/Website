<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova Employee Portal Login</title>
    <style>
        /* body design */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e2f0d9;
            font-family: Arial, sans-serif;
        }

        /* Table color & design*/
        table {
            border-collapse: collapse;
            width: 460px;
            background-color: #ffffff; 
        }

        /* head color */
        thead {
            background-color: #1f4e11;
        }

        /* head text color & design*/
        h2 {
            text-align: center;
            margin: 0;
            padding: 15px 0;
            color: #ffffff; 
            font-size: 2.2em;
            font-weight: normal; 
        }

        /* width, length, height of text and font style */
        tbody td {
            padding: 20px 15px 10px 30px;
            color: #385723;
            font-size: 1.1em;
            font-weight: bold;
        }

        /* password */
        input[type="text"], input[type="password"] {
            width: 250px; 
            padding: 8px;
            box-sizing: content-box;
            background-color: #e2f0d9;
            font-size: 1.1em;
            color: #385723;
        }

        /* location of submit & reset in bottom table */
        tfoot td {
            padding: 15px 10px 25px 25px;
            text-align: left; 
            color: #385723;
            font-size: 1.05em;
        }

        /* submit button style */
        input[type="submit"] {
            background-color: #1f4e11;
            color: #ffffff;
            border: none;
            padding: 8px 24px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            margin-right: 12px;
            margin-left: 100px; 
        }

        /* Reset button style, Reset inputs */
        input[type="reset"] {
            background-color: #548235;
            color: #ffffff;
            border: none;
            padding: 8px 24px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <form action="#" method="post">
        <table align="center">
            <thead>
                <!-- Portal login -->
                <tr>
                    <th colspan="2"><h2>Portal Login</h2></th>
                </tr>
            </thead>

            <tbody>
                <!-- Username input -->
                <tr>
                    <td style="width: 130px;">Username:</td>
                    <td><input type="text" name="username" placeholder="Enter Username" required></td>
                </tr>
                <tr>
                <!-- Password input -->
                    <td>Password:</td>
                    <td><input type="password" name="password" placeholder="Enter Password" required></td>
                </tr>
            </tbody>

            <tfoot>
                <!-- Call Input value submit & reset -->
                <tr>
                    <td colspan="2" style="padding-bottom: 25px;">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">Created by:<b>Dale Danielle A. Peralta</b></td>
                </tr>
            </tfoot>
        </table>
    </form>

</body>
</html>
