<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Demo</title>
    <style>
        .Parent_flex {
            display:flex;
            border: 5px solid black;
            min-height: 100px;
            justify-content: space-evenly;
            align-items: center;
            flex-wrap: wrap;
            flex-direction: row-reverse;
            
        }
        .Child_flex:nth-child(1){
            flex-grow: 0;
            flex-shrink: 1;
            flex-basis:auto;
            background-color: red;
            align-self: flex-start;
        }
        .Child_flex:nth-child(2){
            background-color: blue;
        }
        .Child_flex:nth-child(3){
            background-color: green;
            align-self: flex-end;
        }
        .Child_flex:nth-child(4){
            background-color: yellow;
        }
        .Child_flex:nth-child(5){
            background-color: purple;
            order:3;
            align-self: flex-start;
        }
    </style>
</head>
<body>
    <div class="Parent_flex">
        <div class="Child_flex">Remielle</div>
        <div class="Child_flex">Yae Miko</div>
        <div class="Child_flex">Yae Sakura</div>
        <div class="Child_flex">Evanescia</div>
        <div class="Child_flex">Elysia</div>
    </div>

</body>
</html>
