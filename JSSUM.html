<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS SUM</title>
    <script src="sumfileexternal.js" defer></script>
</head>
<body>
    <form id="JSSum">
         <table align="center" border="1">
            <tr>
                <th colspan="2">JS SUM</th>
            </tr>
            <tr>
                <td colspan="2">First number</td>
                <td><input type="number" id="txtfirst" name="txtfirst"></td>
            </tr>
            <tr>
                <td colspan="2">Second number</td>
                <td><input type="number" id="txtscnd" name="txtscnd"></td>
            </tr>
            <tr>
                <td colspan="2">Result</td>
                <td><input type="text" id="txtresult" name="txtresult" readonly></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <button type="button" onclick="getSum()">Compute</button>
                    <button type="resetbutton">Reset</button>
                </td>
            </tr>
         </table>
    </form>
</body>
</html>
