<body>
    <h1><i><b>JavaScripts</b></i></h1>
    <script>
        var firstn = 100
        var second = 15
        var sum = firstn + second
        var subtraction = firstn - second
        var multiplication = firstn * second
        var division = firstn / second
        var mod = firstn % second
        console.log(sum);
        console.log(subtraction);
        console.log(multiplication);
        console.log(division);
        console.log(mod);
        console.log("firstn " + "+" + " second" + " = " + sum);
        console.log("firstn " + "-" + " second" + " = " + subtraction);
        console.log("firstn " + "*" + " second" + " = " + multiplication);
        console.log("firstn " + "/" + " second" + " = " + division);
        console.log("firstn " + "%" + " second" + " = " + mod);
    </script>
